services:
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: frero-frontend
    ports:
      - '3000:3000'
    depends_on:
      - api
    networks:
      - frero-network
    restart: unless-stopped

  api:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
      target: production
    container_name: frero-api
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-frero}
      DB_PASSWORD: ${DB_PASSWORD:-frero_password}
      DB_NAME: ${DB_NAME:-frero}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_AUTH_MAX: 1000
      RATE_LIMIT_UNAUTH_MAX: 200
      RATE_LIMIT_WINDOW_MS: 60000
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-frero-media}
      AWS_CLOUDFRONT_URL: ${AWS_CLOUDFRONT_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
    networks:
      - frero-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: frero-mysql
    ports:
      - '${DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-frero}
      MYSQL_USER: ${DB_USER:-frero}
      MYSQL_PASSWORD: ${DB_PASSWORD:-frero_password}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --character-set-client-handshake=FALSE
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_ROOT_PASSWORD:-root_password}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - frero-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: frero-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - frero-network
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  uploads-data:
    driver: local

networks:
  frero-network:
    driver: bridge
